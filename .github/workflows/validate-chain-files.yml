name: Validate Chain Files

on:
  pull_request:
    paths:
      - 'constants/additionalChainRegistry/*'
      - 'constants/extraRpcs.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the pull request's merge base is available below.
          fetch-depth: 0

      # workflow_run.pull_requests is empty for fork pull requests, so carry the
      # number in the artifact for comment-validation-failure.yml to read.
      - name: Record pull request number
        run: |
          mkdir -p validation
          echo "${{ github.event.pull_request.number }}" > validation/pr-number.txt

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set changed files
        id: files
        run: |
          # Three-dot diff: the pull request's own changes since it diverged from
          # the base, even when the base branch has moved on since.
          echo "FILES_CHANGED=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep 'constants/additionalChainRegistry/' | tr '\n' ' ' | sed 's/ $//' || true)" >> $GITHUB_ENV
          echo "EXTRA_RPC_CHANGED=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep 'constants/extraRpcs.js' | tr '\n' ' ' | sed 's/ $//' || true)" >> $GITHUB_ENV

      - name: Validate chain and extracRpcs files
        run: |
          node -v
          echo "Files changed: $FILES_CHANGED"
          echo "Extra RPC files changed: $EXTRA_RPC_CHANGED"
          if [ -z "$FILES_CHANGED" ] && [ -z "$EXTRA_RPC_CHANGED" ]; then
            echo "No relevant files changed."
            exit 0
          fi
          pnpm install --frozen-lockfile
          ONLY_LIST_FILE=true pnpm run build
          node .github/scripts/validate-chain-files.js
          
        env:
          FILES_CHANGED: ${{ env.FILES_CHANGED }}
          EXTRA_RPC_CHANGED: ${{ env.EXTRA_RPC_CHANGED }}
          VALIDATION_ERRORS_FILE: validation/validation-errors.txt

      # The token is read-only here, so the comment itself is posted by
      # comment-validation-failure.yml from the workflow_run event.
      - name: Upload validation results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          path: validation
          if-no-files-found: ignore
