name: Comment on validation failure

# Validate Chain Files runs on pull_request, where forks get a read-only token.
# This workflow runs in the base repository's context and posts the result.
on:
  workflow_run:
    workflows: ["Validate Chain Files"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # The decision itself lives in .github/scripts/pr-match.js so it can be
      # tested without a workflow run; this checkout supplies that file.
      - name: Check out pull request matching logic
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download validation results
        uses: actions/download-artifact@v8
        with:
          name: validation-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/validation
        continue-on-error: true

      - name: Comment on pull request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { selectPullRequest } = require(
              path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/pr-match.js')
            );

            const dir = path.join(process.env.RUNNER_TEMP, 'validation');
            const numberFile = path.join(dir, 'pr-number.txt');
            if (!fs.existsSync(numberFile)) {
              console.log('No pull request number in the artifact.');
              return;
            }

            const number = Number(fs.readFileSync(numberFile, 'utf8').trim());
            if (!Number.isInteger(number) || number <= 0) {
              console.log('Invalid pull request number in the artifact.');
              return;
            }

            // The artifact is untrusted. List every PR using this source
            // branch, then let the tested matcher decide which one, if any,
            // may receive the comment.
            const run = context.payload.workflow_run;
            if (!run.head_repository?.full_name || !run.head_branch) {
              console.log('Workflow run is missing its pull request identity.');
              return;
            }
            const headOwner = run.head_repository.full_name.split('/')[0];
            const pullRequests = [];
            let listingTruncated = false;
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                head: `${headOwner}:${run.head_branch}`,
                per_page: 100,
                page,
              });
              pullRequests.push(...data);
              if (data.length < 100) break;
              if (page === 10) listingTruncated = true;
            }
            // An incomplete list could hide the real match. Fail closed instead
            // of reading "no match" into a truncated page set.
            if (listingTruncated) {
              console.log('Pull request listing hit the page cap; not commenting.');
              return;
            }
            const match = selectPullRequest({ run, pullRequests, artifactNumber: number });
            if (!match.number) {
              console.log(match.reason);
              return;
            }

            let errorContent = 'See workflow logs for details.';
            const file = path.join(dir, 'validation-errors.txt');

            try {
              if (fs.existsSync(file)) {
                errorContent = fs.readFileSync(file, 'utf8');
              }
            } catch (error) {
              console.log('Could not read validation errors file:', error.message);
            }

            // Comments are capped at 65536 characters.
            if (errorContent.length > 60000) {
              errorContent = errorContent.slice(0, 60000) + '\n... (truncated)';
            }

            // Replace backticks with a visually similar character: Markdown
            // ignores backslash escapes inside fenced code blocks.
            const escapeFences = (s) => s.replace(/`/g, '\u02cb');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body:
                'Validation failed for chain files. Please check the workflow logs for details.\n\n' +
                'Error message:\n```\n' +
                escapeFences(errorContent) +
                '\n```'
            });
