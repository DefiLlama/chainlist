# nginx config for serving the static export in out/ (replaces `serve out` + serve.json).
# Include this file in the http context, e.g. /etc/nginx/conf.d/chainlist.conf,
# with `root` holding the contents of out/ (/usr/share/nginx/html in nginx:alpine).

# serve.json "cleanUrls": strip ".html", then a trailing "/index" (so /index.html -> /index -> /).
# Matched against the raw $request_uri so percent-encoded names (/chain/ethereum%20mainnet.html)
# stay encoded in the Location header; the query string is dropped, as serve does.
# base must not start with "//" or "/\", which browsers read as another host (open redirect).
# The backslash is written as \x5c because nginx's config parser turns "\\" into "\".
map $request_uri $chainlist_clean_redirect {
  ~^(?<base>/(?![/\x5c\s])[^?]*)\.html(?:\?.*)?$  $base;
  ~^/index(?:\?.*)?$                              /;
  ~^(?<base>/(?![/\x5c\s])[^?]*)/index(?:\?.*)?$  $base;
}

# serve.json "redirects": /top-rpcs/* and /best-rpcs/* -> /chain/*
map $request_uri $chainlist_rpcs_redirect {
  ~^/(?:top|best)-rpcs/(?<rest>[^?]+)  /chain/$rest;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json;

  gzip on;
  gzip_vary on;
  gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

  autoindex off;
  absolute_redirect off;
  server_tokens off;

  error_page 404 /404.html;

  if ($chainlist_clean_redirect) {
    return 301 $chainlist_clean_redirect;
  }

  if ($chainlist_rpcs_redirect) {
    return 308 $chainlist_rpcs_redirect;
  }

  location ^~ /_next/image {
    return 302 https://icons.llamao.fi/icons/misc/sus-chainlist;
  }

  location = /rpcs.json {
    add_header Access-Control-Allow-Origin *;
  }

  location = / {
    try_files /index.html =404;
  }

  # /chain/1/ serves the same page as /chain/1
  location ~ ^(?<stem>.+)/$ {
    try_files $stem/index.html $stem.html =404;
  }

  # /chain/1 -> chain/1.html; plain files (rpcs.json, _next/static/*) as-is; directories 404
  location / {
    try_files $uri/index.html $uri.html $uri =404;
  }
}
